<div class="erp-shell">
  <header class="erp-topbar">
    <div class="brand-row">
      <a routerLink="/" class="brand" (click)="closeMenu()">
        <span class="brand-logo">C&amp;M</span>
        <div>
          <div class="brand-title">Distribuciones C&amp;M</div>
          <div class="brand-sub">Control y Mercancía · ERP</div>
        </div>
      </a>

      <button type="button" class="menu-toggle" (click)="toggleMenu()" aria-label="Abrir menú">
        ☰
      </button>
    </div>

    <nav class="erp-nav" [class.erp-nav--open]="menuOpen()">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="nav-link" (click)="closeMenu()">Inicio</a>
      <a routerLink="/pedidos" routerLinkActive="active" class="nav-link" (click)="closeMenu()">Pedidos</a>
      <a routerLink="/inventario" routerLinkActive="active" class="nav-link" (click)="closeMenu()">Inventario</a>
      <a routerLink="/almacenes" routerLinkActive="active" class="nav-link" (click)="closeMenu()">Almacenes</a>
      <a routerLink="/compras" routerLinkActive="active" class="nav-link" (click)="closeMenu()">Compras</a>
      @if (authService.isLoggedIn()) {
        <a routerLink="/login" routerLinkActive="active" class="nav-link nav-link--session" (click)="closeMenu()">
          {{ authService.currentRole() || 'Sesión' }}
        </a>
      } @else {
        <a routerLink="/login" routerLinkActive="active" class="nav-link nav-link--login" (click)="closeMenu()">
          Login
        </a>
      }
    </nav>
  </header>

  <div class="status-bar">
    <span class="status-dot" [class.status-dot--error]="!!errorMessage()"></span>
    <span><strong>API REST:</strong> {{ statusMessage() }}</span>
    @if (errorMessage()) {
      <span class="status-error">{{ errorMessage() }}</span>
    }
  </div>

  <main class="erp-main">
    <router-outlet />
  </main>
</div>
